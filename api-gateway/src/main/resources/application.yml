spring:
    application:
        name: api-gateway

    cloud:
      gateway:
          server:
              webflux:
                routes:
                      - id: auth-service
                        uri: lb://AUTH-SERVICE
                        predicates:
                          - Path=/api/auth/**

                      - id: product-service
                        uri: lb://PRODUCT-SERVICE
                        predicates:
                          - Path=/api/products/**
    jwt:
      secret: SecretKeyMicroservice12131202131!
server:
    port: 8081

eureka:
    client:
        service-url:
          defaultZone: http://localhost:8761/eureka/
    instance:
        prefer-ip-address: true
        lease-renewal-interval-in-seconds: 5
        lease-expiration-duration-in-seconds: 10